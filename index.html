<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivek Adithya - Wet Paint</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<body>
    <div class="container">
        <div class="content">
            <h1 class="headline">You're here early.</h1>

            <div class="paint-wall">
                <div class="paint-drop paint-drop-1"></div>
                <div class="paint-drop paint-drop-2"></div>
                <div class="paint-drop paint-drop-3"></div>
                <div class="paint-drop paint-drop-4"></div>
                <div class="paint-drop paint-drop-5"></div>
                <div class="paint-drop paint-drop-6"></div>
                <div class="paint-drop paint-drop-7"></div>
                <div class="paint-drop paint-drop-8"></div>
            </div>
            
            <div class="retro-decoration">
                <div class="scan-lines"></div>
            </div>
        </div>
    </div>
</body>
</html>
